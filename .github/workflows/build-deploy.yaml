name: Build and Deploy Full Stack app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-run-backend:
    environment:
      name: testing
    env:
      POSTGRES_HOST: ${{secrets.POSTGRES_HOST}}
      POSTGRES_PORT: ${{secrets.POSTGRES_PORT}}
      POSTGRES_PASSWORD: ${{secrets.POSTGRES_PASSWORD}}
      POSTGRES_DB: ${{secrets.POSTGRES_DB}}
      POSTGRES_USER: ${{secrets.POSTGRES_USER}}
      JWT_SECRET_KEY: ${{secrets.JWT_SECRET_KEY}}
      JWT_ALGORITHM: ${{secrets.JWT_ALGORITHM}}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${{secrets.JWT_ACCESS_TOKEN_EXPIRE_MINUTES}}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${{secrets.JWT_REFRESH_TOKEN_EXPIRE_DAYS}}

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: ${{secrets.DATABASE_PASSWORD}}
          POSTGRES_DB: ${{secrets.DATABASE_NAME}}_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    runs-on: ubuntu-latest
    steps:
      - name: pulling git repo
        uses: actions/checkout@v7
      - name: install python version 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: upgrade pip
        run: python -m pip install --upgrade pip
      - name: install all python backend dependencies
        run: pip install -r server/requirements.txt
      - name: test with pytest
        run: |
          pip install pytest
          pytest
