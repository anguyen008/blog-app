# Development docker-compose file for the full stack application
services:
  client:
    build: ./client/.
    ports:
      - 5173:5173
    restart: always
    depends_on:
      db:
        condition: service_healthy

  server:
    build: ./server/.
    ports:
      - 8000:8000
    restart: always
    env_file:
      - ./server/.env
    environment:
      - POSTGRES_HOST=db
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres
    restart: always
    env_file:
      - ./server/.env
    volumes:  
      - db-data:/var/lib/postgresql
    expose:
      - 5432
    ports:
      - 5432:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER" ]
      interval: 10s
      timeout: 5s
      retries: 5
    
volumes:
  db-data:


